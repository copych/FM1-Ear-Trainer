name: Release Ear Trainer firmware and recovery tools
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ear-trainer-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("project.json"))["version"])')
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(python3 melodee/tools/fm1_recover.py --version | awk '{print $NF}')" = "$version"
          test -f "docs/RELEASE_$version.md"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Refusing to replace a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false \
              --title "FM-1 Ear Trainer $version" --notes-file "docs/RELEASE_$version.md"
          fi
  firmware:
    needs: prepare
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: bash tools/build-pages-ci.sh
      test: |
        bash tools/test-pages-ci.sh
        python3 tools/test-release.py
      tests-block: true
      packages: build/public/*
  recovery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: melodee
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned bundler and USB dependencies
        run: python -m pip install pyinstaller==6.22.3 pyusb==1.3.1
      - name: Test recovery logic
        run: |
          python tests/recovery_test.py
          python tests/recovery_correction_test.py
      - name: Build and smoke-test native executable
        run: python tools/build_recovery.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.target }}
          path: melodee/build/recovery/${{ matrix.target }}/*.zip
          if-no-files-found: error
  publish:
    needs: [firmware, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - uses: actions/download-artifact@v4
        with:
          pattern: recovery-*
          path: build/native-recovery
          merge-multiple: true
      - name: Verify source attestations and package checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build/attested
          sha256sum -c SHA256SUMS
          cd build/public
          sha256sum -c SHA256SUMS
          for file in *.fwsc *.bin *.zip *.tar.gz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Validate complete release without rebuilding firmware
        run: python3 tools/prepare-release.py build/attested/build/public build/native-recovery build/release
      - name: Publish validated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          gh release upload "$GITHUB_REF_NAME" build/release/* --clobber
          # The shared builder attaches its attested development filenames to
          # the draft. Replace those with the validated versioned filenames.
          for file in ear-trainer-dev.fwsc ear-trainer-dev-res.bin ear-trainer-app.bin ear-trainer-recovery-sources.zip ear-trainer-site.tar.gz; do
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$file" --yes
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest \
            --title "FM-1 Ear Trainer $version" --notes-file "docs/RELEASE_$version.md"
