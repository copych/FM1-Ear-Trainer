name: Build, attest and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: bash tools/build-pages-ci.sh
      test: bash tools/test-pages-ci.sh
      tests-block: true
      packages: build/public/*
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages
          path: attested
      - name: Verify source attestations and matching firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd attested
          sha256sum -c SHA256SUMS
          cd build/public
          sha256sum -c SHA256SUMS
          for file in ear-trainer-site.tar.gz ear-trainer-dev.fwsc ear-trainer-dev-res.bin ear-trainer-recovery-sources.zip; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-digest "$GITHUB_SHA"
          done
          mkdir "$GITHUB_WORKSPACE/site"
          tar -xzf ear-trainer-site.tar.gz -C "$GITHUB_WORKSPACE/site"
          cmp ear-trainer-dev.fwsc "$GITHUB_WORKSPACE/site/firmware/ear-trainer-dev.fwsc"
          cmp ear-trainer-dev-res.bin "$GITHUB_WORKSPACE/site/firmware/ear-trainer-dev-res.bin"
          cmp ear-trainer-recovery-sources.zip "$GITHUB_WORKSPACE/site/firmware/ear-trainer-recovery-sources.zip"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
